# Copy only for a NEW lab. Never overwrite an existing working lab.ini.
[app_servers]
app01 ansible_host=CHANGE_ME_APP_IP ansible_user=CHANGE_ME_APP_USER

[monitoring_servers]
mon01 ansible_host=CHANGE_ME_MON_IP ansible_user=CHANGE_ME_MON_USER

[all:vars]
