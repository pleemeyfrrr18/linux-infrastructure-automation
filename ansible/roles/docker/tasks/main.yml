- name: Inspect installed packages before selecting Docker CE
  ansible.builtin.package_facts:
    manager: apt
- name: Refuse to remove conflicting container packages automatically
  ansible.builtin.assert:
    that:
      - "['docker.io', 'docker-compose', 'docker-compose-v2', 'docker-doc', 'docker-buildx', 'podman-docker', 'containerd', 'runc'] | intersect(ansible_facts.packages.keys() | list) | length == 0"
    fail_msg: Conflicting container packages exist. Review migration manually; this role never removes packages or data.
- name: Create Docker keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Install Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: '0644'
- name: Configure Docker repository for the detected Ubuntu codename
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: |
      deb [arch={{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts.distribution_release }} stable
    owner: root
    group: root
    mode: '0644'
  register: docker_repository
- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
    update_cache: true
    cache_valid_time: "{{ 0 if docker_repository.changed else 3600 }}"
- name: Enable Docker daemon
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
