name: Infrastructure CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-control.txt
      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements-control.txt
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Publication secret guard
        run: python scripts/check-publication.py
      - name: Application and publication guard tests
        run: |
          python -m unittest discover -s app -v
          python -m unittest discover -s tests -v
      - name: Configuration and Bash validation
        run: |
          python scripts/validate.py
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Ansible syntax
        working-directory: ansible
        run: |
          for playbook in playbooks/*.yml tests/*.yml; do
            ansible-playbook -i tests/inventory/ci.ini "$playbook" --syntax-check
          done
      - name: Local Ansible regression fixtures (no VM access)
        working-directory: ansible
        run: |
          ansible-playbook -i tests/inventory/ci.ini tests/preflight.yml
          ansible-playbook -i tests/inventory/ci.ini tests/apt-sources.yml
  containers:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Compose files
        env:
          GRAFANA_ADMIN_PASSWORD: ci-only-password-not-a-real-secret
        run: |
          docker compose -f docker/app.compose.yaml config --quiet
          docker compose -f docker/monitoring.compose.yaml config --quiet
      - name: Validate Prometheus and test alerts
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.2.1 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/work:ro" -w /work prom/prometheus:v3.2.1 test rules alerts.test.yml
      - name: Build image and run ephemeral integration tests
        run: scripts/integration.sh
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-failure-logs
          path: artifacts/integration/
          if-no-files-found: ignore
          retention-days: 7
